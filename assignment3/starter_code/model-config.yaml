# input/cache/output: USD per 1,000,000 tokens. cache = cache-hit input.
# Leave a price blank for unknown; use 0 only when explicitly free.
# Docker Desktop: egress proxies reach the host service via host.docker.internal.
# local-no-auth is an SDK placeholder, not a real secret; this local service needs no key.
# Verified 2026-10-29: Standard API rates, prompts <=272K input tokens.
# Used as an API-equivalent cost estimate, not a ChatGPT subscription bill.
# Long-context multipliers and separate cache-write pricing are not modeled here.
# https://developers.openai.com/api/docs/models/gpt-6.1-sol
# https://developers.openai.com/api/docs/models/gpt-5.6-terra
# https://developers.openai.com/api/docs/models/gpt-5.6-luna
expert:
  base_url: http://host.docker.internal:18765/v1
  api_format: messages
  model_name: gpt-6.1-sol
  api_key: local-no-auth
  input: 2.00
  cache: 0.10
  output: 10.00

standard:
  base_url: http://host.docker.internal:18765/v1
  api_format: messages
  model_name: gpt-5.6-terra
  api_key: local-no-auth
  input: 2.00
  cache: 0.20
  output: 12.00

starter:
  base_url: http://host.docker.internal:18765/v1
  api_format: messages
  model_name: gpt-5.6-luna
  api_key: local-no-auth
  input: 0.20
  cache: 0.02
  output: 1.20
